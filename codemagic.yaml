workflows:
  ios-release:
    name: My Mahj Card iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MahjCard ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mymahjcard.app
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Find app folder
        script: |
          echo "Files in repo:"
          find . -maxdepth 3 -not -path '*/node_modules*' -not -path '*/.git*' | sort
          CFG=$(find . -maxdepth 3 -name capacitor.config.json -not -path '*/node_modules*' | head -1)
          if [ -z "$CFG" ]; then echo "capacitor.config.json is missing from the repo"; exit 1; fi
          APP_DIR="$CM_BUILD_DIR/$(dirname "$CFG")"
          echo "APP_DIR=$APP_DIR" >> $CM_ENV
          echo "App folder: $APP_DIR"
          if [ ! -f "$APP_DIR/www/index.html" ]; then echo "www/index.html is missing from the repo"; exit 1; fi
      - name: Install tools
        script: |
          cd "$APP_DIR"
          if [ ! -f package.json ]; then
            echo "package.json missing, creating it"
            cat > package.json <<'EOF'
          {
            "name": "my-mahj-card",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/ios": "^7.0.0",
              "@capacitor/splash-screen": "^7.0.0",
              "@capacitor/status-bar": "^7.0.0",
              "@capacitor/push-notifications": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0",
              "@capacitor/assets": "^3.0.5"
            }
          }
          EOF
          fi
          npm install --include=dev
      - name: Create iPhone project
        script: |
          cd "$APP_DIR"
          [ -d ios ] || npx cap add ios
          npx capacitor-assets generate --ios || echo "Icon generation skipped"
          npx cap sync ios
      - name: Turn on push notifications
        script: |
          cd "$APP_DIR/ios/App"
          cat > App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          EOF
          grep -q CODE_SIGN_ENTITLEMENTS App.xcodeproj/project.pbxproj || \
            sed -i '' 's#INFOPLIST_FILE = App/Info.plist;#INFOPLIST_FILE = App/Info.plist; CODE_SIGN_ENTITLEMENTS = App/App.entitlements;#g' App.xcodeproj/project.pbxproj
          if ! grep -q capacitorDidRegisterForRemoteNotifications App/AppDelegate.swift; then
          python3 - <<'PY'
          p = "App/AppDelegate.swift"
          s = open(p).read()
          i = s.rstrip().rfind("}")
          add = """
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          """
          open(p, "w").write(s[:i] + add + s[i:])
          PY
          fi
          # standard HTTPS only, so App Store Connect skips the encryption question
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" App/Info.plist
          grep -n "aps-environment" App/App.entitlements && grep -n "capacitorDidRegister" App/AppDelegate.swift
      - name: Set up signing
        script: |
          cd "$APP_DIR"
          xcode-project use-profiles --project "ios/App/App.xcodeproj"
      - name: Set build number
        script: |
          cd "$APP_DIR/ios/App"
          agvtool new-version -all $BUILD_NUMBER
      - name: Build app
        script: |
          cd "$APP_DIR"
          xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - "**/build/ios/ipa/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
